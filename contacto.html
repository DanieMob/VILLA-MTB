<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="VILLA MTB - Rutas de Mountain Bike y contacto.">


    <title>VILLA MTB | Contacto</title>
    
    <link rel="stylesheet" href="style.css">

    <!--* Icono de búsqueda para la barra del buscador-->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


</head>


<body class = "pagina-contacto">

    <!-- =========================================
         ENCABEZADO
    ========================================== -->

    <header>

        <h1>VILLA MTB</h1>

        <p>Rutas de Mountain Bike </p>

    </header>


    <!-- =========================================
         NAVEGACIÓN
    ========================================== -->

    <nav aria-label="Navegación principal">

        <a href="index.html">Inicio</a>

        <a href="rutas.html" >Rutas</a>

        <a href="galerias.html">Galería</a>

        <a href="contacto.html" aria-current="page">Contacto</a>

    </nav>


    <!-- =========================================
         CONTENIDO PRINCIPAL
    ========================================== -->

    <main>

        <!-- =========================================
             FORMULARIO DE CONTACTO
        ========================================== -->

        <div class="contacto">

            <article>

                <h2 id="titulo-contacto"> La ruta apenas empieza. Contáctanos para obtener
                    más información y recibir la ruta completa:</h2>

                <form action="#" method="post">

                    <label for="nombre">Nombre:</label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        autocomplete="given-name"
                        required
                    >


                    <label for="apellido">Apellido:</label>

                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        autocomplete="family-name"
                        required
                    >


                    <label for="telefono">Teléfono:</label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        autocomplete="tel"
                    >


                    <label for="email">Correo electrónico:</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                    >


                    <label for="mensaje">Mensaje:</label>

                    <textarea
                        id="mensaje"
                        name="mensaje"
                        required
                    ></textarea>


                    <button type="submit">
                        Enviar mensaje
                    </button>

                </form>

            </article>

        </div>



    </main>



    <!-- =========================================
         PIE DE PÁGINA
    ========================================== -->

    <footer>

        <p>VILLA MTB &copy; 2026</p>

        <p>Página creada como actividad académica.</p>

    </footer>

</body>

</html>
